name: zen-broadcast

on:
  workflow_dispatch: # 保留手動抽籤開示按鈕
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 = 台灣時間隔天早上的 06:00

jobs:
  run-zen-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Zen Bot Script
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          python bot.py
